name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 无依赖：不需要 npm install
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check bin/profile.mjs
          node --check mcp/server.mjs
          node --check _selftest.mjs
          node --check _e2e.mjs
          node --check _audit.mjs
          node --check _audit2.mjs
          node --check _audit3.mjs
          node --check _audit4.mjs
          node --check _audit5.mjs
          node --check _audit6.mjs
          node --check _audit7.mjs
          node --check _compat.mjs
          node --check _render.mjs
          node --check _qa-frames.mjs

      - name: Unit tests (storage / conflicts / injection)
        run: node _selftest.mjs

      - name: Adversarial audit 1 (edges: dirty input / lock / scope)
        run: node _audit.mjs

      - name: Adversarial audit 2 (corruption / round-trip / limits)
        run: node _audit2.mjs

      - name: Adversarial audit 3 (logic: budget / gates / MCP / panel consistency)
        run: node _audit3.mjs

      - name: Adversarial audit 4 (compat layer: caps file / doctor / event aliases)
        run: node _audit4.mjs

      - name: Adversarial audit 5 (settings ↔ set drift / health / explain)
        run: node _audit5.mjs

      - name: Adversarial audit 6 (input shapes / encryption / protocol errors)
        run: node _audit6.mjs

      - name: Adversarial audit 7 (ingest from another AI)
        run: node _audit7.mjs

      - name: Degraded host matrix
        run: node _compat.mjs

      - name: Panel render smoke test
        run: node _render.mjs

      # _e2e.mjs 的 HTTP 段需要运行中的宿主；CI 只跑纯 CLI 段
      - name: End-to-end (CLI only)
        run: node _e2e.mjs --cli-only

      - name: Install health check
        run: node scripts/verify-install.mjs
