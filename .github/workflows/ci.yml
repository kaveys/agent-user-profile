name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖：不需要 npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check bin/profile.mjs
          node --check lib/text.mjs
          node --check lib/relevance.mjs
          node --check mcp/server.mjs
          node --check scripts/register.mjs
          node --check scripts/verify-install.mjs
          node --check tests/selftest.mjs
          node --check tests/e2e.mjs
          node --check tests/render.mjs
          node --check tests/compat.mjs
          node --check tests/qa-frames.mjs
          node --check tests/audit-1.mjs
          node --check tests/audit-2.mjs
          node --check tests/audit-3.mjs
          node --check tests/audit-4.mjs
          node --check tests/audit-5.mjs
          node --check tests/audit-6.mjs
          node --check tests/audit-7.mjs
          node --check tests/audit-8.mjs
          node --check tests/audit-9.mjs
          node --check tests/audit-10.mjs

      - name: Unit tests (storage / conflicts / injection)
        run: node tests/selftest.mjs

      - name: Audit 1 — edges (dirty input / lock / scope)
        run: node tests/audit-1.mjs

      - name: Audit 2 — corruption / round-trip / limits
        run: node tests/audit-2.mjs

      - name: Audit 3 — logic (budget / gates / MCP / panel consistency)
        run: node tests/audit-3.mjs

      - name: Audit 4 — compat layer (caps file / doctor / event aliases)
        run: node tests/audit-4.mjs

      - name: Audit 5 — settings ↔ set drift / health / explain
        run: node tests/audit-5.mjs

      - name: Audit 6 — input shapes / encryption / protocol errors
        run: node tests/audit-6.mjs

      - name: Audit 7 — ingest from another AI
        run: node tests/audit-7.mjs

      - name: Audit 8 — similar entries are merged actively
        run: node tests/audit-8.mjs

      - name: Audit 9 — explain and injection agree
        run: node tests/audit-9.mjs

      - name: Audit 10 — refactor equivalence and repo consistency
        run: node tests/audit-10.mjs

      - name: Degraded host matrix
        run: node tests/compat.mjs

      - name: Panel render smoke test
        run: node tests/render.mjs

      # tests/e2e.mjs 的 HTTP 段需要运行中的宿主；CI 只跑纯 CLI 段
      - name: End-to-end (CLI only)
        run: node tests/e2e.mjs --cli-only

      - name: Install health check
        run: node scripts/verify-install.mjs
